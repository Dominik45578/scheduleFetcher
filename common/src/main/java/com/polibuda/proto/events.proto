syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.polibuda.proto";
option java_outer_classname = "EventsProto";

// potrzebny import dla Empty
import "google/protobuf/empty.proto";

// 🔹 Zapytanie klienta: filtr wydarzeń
message FilterRequest {
  string faculty = 1;         // np. W4, WEiTI, itp.
  repeated string groups = 2; // lista grup
}

// 🆕 Nowa wiadomość reprezentująca RRuleDto
message RRule {
  string dtstart = 1;
  string freq = 2;
  int32 interval = 3; // Integer w Javie mapuje się na int32
  string until = 4;
}

// 🔹 Definicja pojedynczego eventu (teraz z polem rrule)
message Event {
  string duration = 1;
  string end = 2;
  string endDate = 3;
  string eventType = 4;
  string faculty = 5;
  string group = 6;
  string instructor = 7;
  int32 interval = 8; // UWAGA: To pole jest teraz w RRule, rozważ usunięcie stąd jeśli się duplikuje
  string room = 9;
  string start = 10;
  string startDate = 11;
  string startTime = 12;
  string title = 13;
  RRule rrule = 14;
}

// 🔹 Odpowiedź z serwera dla filtrowania
message FilteredEventsResponse {
  repeated Event events = 1;
}

// ========================================
// 🔹 Nowe modele danych: Faculty & Group
// ========================================

// pojedynczy wydział
message Faculty {
  string code = 1;
}

// pojedyncza grupa
message Group {
  string code = 1;
}

// 🔹 Odpowiedzi zbiorcze (listy)
message FacultiesResponse {
  repeated Faculty faculties = 1;
}

message GroupsResponse {
  repeated Group groups = 1;
}

// ========================================
// 🔹 Serwis gRPC
// ========================================

service EventService {
  // dotychczasowa metoda
  rpc GetFilteredEvents (FilterRequest) returns (FilteredEventsResponse);

  // 🆕 nowe metody
  rpc GetFaculties (google.protobuf.Empty) returns (FacultiesResponse);
  rpc GetGroups (google.protobuf.Empty) returns (GroupsResponse);
}